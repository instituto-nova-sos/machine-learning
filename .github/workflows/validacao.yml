name: Validação educacional

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Git Bash também está disponível nos runners Windows; cada erro encerra a etapa.
    shell: bash

env:
  MPLBACKEND: Agg
  PYTHONUTF8: "1"

jobs:
  base:
    name: Base / ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.deps }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12"]
        deps: [atuais]
        include:
          # O piso exato é exercitado em 3.11, sem substituir a matriz da instalação usual.
          - os: ubuntu-latest
            python: "3.11"
            deps: minimas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            tests/constraints-min.txt
      - name: Instalar a base
        if: matrix.deps == 'atuais'
        run: python -m pip install -e '.[dev]'
      - name: Instalar os mínimos declarados
        if: matrix.deps == 'minimas'
        run: python -m pip install -c tests/constraints-min.txt -e '.[dev]'
      - name: Verificar dependências, código e testes
        run: |
          python -m pip check
          python -m ruff check .
          python -m mypy
          python -m pytest
      - name: Executar as práticas em CPU e conferir o material
        # Comandos Python evitam exigir GNU Make na máquina Windows da turma.
        run: |
          python scripts/gerar_dados_imoveis.py
          python -m sos_ml.train --data data/processed/imoveis.csv --output artifacts/modelo_linear.json
          python -m sos_ml.evaluate --data data/processed/imoveis.csv --model artifacts/modelo_linear.json
          python -m sos_ml.predict --model artifacts/modelo_linear.json --area 85
          python scripts/visualizar_regressao.py
          python -m sos_ml.classify --plot artifacts/classificacao_e_perda.png
          python -m sos_ml.assess
          python -m sos_ml.generalization --plot artifacts/generalizacao.png
          python -m sos_ml.network_demo
          python scripts/jev_opcional.py
          python -m sos_ml.local_ai treinar --plot artifacts/mlp_treino_validacao.png
          python -m sos_ml.local_ai inferir --temperature 80 --vibration 5 --high-consequence --measure
          python -m sos_ml.local_ai inferir --temperature 150 --vibration 5
          python scripts/verificar_material.py

  pytorch:
    name: PyTorch CPU / Python ${{ matrix.python }} / ${{ matrix.deps }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        deps: [atuais, minimo]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Instalar a base
        run: python -m pip install -e '.[dev]'
      - name: Instalar PyTorch CPU atual
        if: matrix.deps == 'atuais'
        run: python -m pip install 'torch>=2.10,<3' --index-url https://download.pytorch.org/whl/cpu
      - name: Instalar o mínimo PyTorch CPU
        if: matrix.deps == 'minimo'
        run: python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
      - name: Verificar a ponte, persistência e inferência em outro processo
        run: |
          python -m pip check
          make validate-torch
